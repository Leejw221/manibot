# @package _global_

policy:
  name: cfm
  action_horizon: 8
  pred_horizon: 16
  obs_horizon: 1

  # Vision encoder
  crop_is_random: true
  spatial_softmax_num_keypoints: 32
  use_separate_rgb_encoder_per_camera: true

  flow_matcher:
    name: conditional
    sigma: 0.0
    num_sampling_steps: 6

  unet:
    down_dims: [256, 512]
    kernel_size: 5
    n_groups: 8
    diffusion_step_embed_dim: 256
    use_film_scale_modulation: true
