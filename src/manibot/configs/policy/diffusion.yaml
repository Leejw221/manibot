# @package _global_

# DP paper (arXiv:2303.04137): batch_size 64 for image-based tasks.
# Overridden here (not default_policy.yaml) so other policies keep their own batch_size.
train:
  batch_size: 64

policy:
  name: diffusion
  action_horizon: 8
  pred_horizon: 16
  obs_horizon: 2

  # Vision encoder
  # 원본 Diffusion Policy 구현을 따른다 — scratch ResNet18 의 BatchNorm 을 GroupNorm 으로
  # 바꾼다. 사전학습 가중치와는 같이 못 쓴다(GroupNorm 교체가 그 가중치를 망가뜨린다).
  use_group_norm: true
  pretrained_backbone_weights: null
  crop_is_random: true
  spatial_softmax_num_keypoints: 32
  use_separate_rgb_encoder_per_camera: true

  noise_scheduler:
    type: DDIM
    num_train_timesteps: 100
    # DDIM 10 — 원문 Diffusion Policy 의 **실물** 설정(§3.4 "100 training iterations and
    # 10 inference iterations")과 같다.  시뮬 벤치마크는 DDPM 100 이지만 우리는 비동기 배포를
    # 쓰므로 전부 DDIM 으로 통일한다 [사용자 결정 2026-09-08].
    # 근거: 청크 재생이 action_horizon/fps = 8/20 = 400 ms 인데 그 안에 추론이 들어가야
    # 비동기로 가려진다.  DDIM 20 이 224 ms(실측), DDPM 100 은 약 1.1 s 로 못 들어간다.
    # ⚠ 대가: 원문 시뮬 수치(square 35% 등)와 조건이 달라 직접 비교는 못 한다.
    num_inference_steps: 10
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    prediction_type: epsilon
    clip_sample: true
    clip_sample_range: 1.0

  unet:
    down_dims: [512, 1024, 2048]
    kernel_size: 5
    n_groups: 8
    diffusion_step_embed_dim: 128
    use_film_scale_modulation: true
