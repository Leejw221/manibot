defaults:
  - default_policy
  - _self_

# 배포할 base policy. 반드시 지정한다.
checkpoint_path: ???
# ⚠ **안전 상한**이다. 라운드 크기는 round_size_ratio(프레임)로 정한다.
n_episodes: 200
# 라운드 목표 = demo 프레임 x 이 값.  1.5 는 SIRIUS/APO 두 조건에 같은 데이터량을 주려고
# 정한 규약이다 (합친 데이터셋의 demo 비율 40%).  null 이면 n_episodes 로만 센다.
round_size_ratio: 1.5
# 한 에피소드 최대 스텝. 개입하며 고치다 보면 길어질 수 있어 넉넉히 준다.
max_steps: 1200
# 저장은 **실물과 같은 LeRobotDataset**. 학습은 scripts/convert.py 로 zarr 화해 읽는다.
repo_id: ???
# LeRobot 은 프레임마다 자연어 task 를 요구한다.
single_task: "put the square nut on the peg"
# null 이면 LeRobot 기본 위치(~/.cache/huggingface/lerobot/<repo_id>).
# **이미 있으면 이어받는다** — 중간에 죽어도 같은 명령을 다시 주면 된다.
root: null
# 몇 에피소드마다 finalize 할지. finalize 전에 죽으면 그 뒤 것은 footer 가 없어 못 읽는다.
save_every: 5
# 이미지를 mp4 로 인코딩할지. **실물과 같게 true 로 둔다** (사용자 결정 2026-09-09).
# ⚠ SVT-AV1 프로세스 풀이 죽은 적이 있다 [실측 2026-09-09: ep11 저장 중 BrokenProcessPool,
#   원인 미규명 — 커널 로그에 기록 없고 디스크·메모리는 여유였다].  그때 save_every 덕에
#   11개 중 10개가 남았다.  죽으면 같은 명령을 다시 주면 이어받는다.
#   시뮬 84x84 에서 영상이 아끼는 용량은 크지 않다(50 에피소드 PNG 로도 약 160 MB) —
#   인코더가 계속 문제면 false 로 두면 된다. 스키마·학습 경로는 같다.
use_videos: true
# ⚠ APO 의 c=0(개입 직전 K 프레임)은 여기서 만들지 않는다 —
#    학습 직전에 utils/intervention_labels.relabel_preintv(mode, k) 로 만든다.
use_ema: true
# 실시간 창. Wayland 라 pynput 전역 캡처가 안 되므로 **이 창이 조작면**이다 —
# 창에 포커스를 두고 i/n/r/s/q 를 누른다.
view: true
view_res: 384
# 사람이 보고 반응할 수 있게 실시간으로 늦춘다. 0 이면 페이싱 없음(무인 테스트용).
control_fps: 20
# 재생 중에 다음 청크를 계산한다 — 실물에는 추론 지연이 원래 있으므로 시뮬도 같게 둔다.
# 지연은 청크를 **절대 스텝에 앵커**해 흡수한다(늦게 온 청크는 앞부분이 버려질 뿐이다).
async_infer: true
# 청크 합치기 — 실물(`manipulation_pipeline`)과 같은 이름·기본값을 쓴다.
#   overwrite         마지막 청크만 쓴다
#   temporal_ensemble 겹치는 청크들을 ACT 식 지수가중 평균 (실물 기본값)
merger: temporal_ensemble
te_coeff: 0.01
