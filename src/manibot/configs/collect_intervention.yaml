defaults:
  - default_policy
  - _self_

# 배포할 base policy. 반드시 지정한다.
checkpoint_path: ???
n_episodes: 10
# 한 에피소드 최대 스텝. 개입하며 고치다 보면 길어질 수 있어 넉넉히 준다.
max_steps: 1200
# 개입 시작 직전 몇 프레임을 c=0(실패로 이어진 행동)으로 재라벨할지.
# APO 부록 B: "the last 10 actions before human intervention".
preintv_k: 10
# null 이면 task.hdf5_path 옆에 *_intervention.hdf5 로 쓴다.
out_path: null
use_ema: true
# 실시간 창. Wayland 라 pynput 전역 캡처가 안 되므로 **이 창이 조작면**이다 —
# 창에 포커스를 두고 i/n/r/s/q 를 누른다.
view: true
view_res: 384
# 사람이 보고 반응할 수 있게 실시간으로 늦춘다. 0 이면 페이싱 없음(무인 테스트용).
control_fps: 20
# 지금 청크를 재생하는 동안 다음 청크를 계산한다. 끊김이 사라진다.
# ⚠ 다음 청크가 한 청크 전 관측으로 계산되므로 배포 지연이 생긴다(실물엔 원래 있다).
async_infer: true
