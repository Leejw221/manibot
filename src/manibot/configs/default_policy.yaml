defaults:
  - _self_
  - task: piper_cube_stack
  - policy: diffusion
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

hydra:
  output_subdir: null
  run:
    dir: .

session: ${policy.name}-${now:%Y%m%d_%H%M%S}
base_dir: ${hydra:runtime.cwd}
output_dir: ${base_dir}/outputs/${task.name}/${policy.name}/${session}
log_dir: ${output_dir}/logs
checkpoint_dir: ${output_dir}/checkpoints
init_states: null          # 저장된 시뮬 초기상태 npz. 주면 정책 간 평가가 정확히 짝지어진다
eval_deterministic: true   # 같은 seed 로 같은 결과. cudnn 비결정성이 폐루프에서 증폭된다
checkpoint_path: null
eval_dir: ${output_dir}/eval
val_dir: ${output_dir}/val
resume: false

debug: false
seed: 42
device: cuda:0

# Training
optimizer_lr: 1e-4
optimizer_lr_backbone: 1e-5
optimizer_betas: [0.95, 0.999]
optimizer_eps: 1e-8
optimizer_weight_decay: 1e-6
scheduler_name: cosine
scheduler_warmup_steps: 500
use_ema: true
ema_power: 0.75

# Training settings
train:
  steps: 100000
  batch_size: 128
  num_workers: 8
  log_freq: 100
  save_freq: 10000
  keep_freq: 50000
  grad_clip_norm: 1.0
  save_best: true
  use_amp: true

# 고정 probe (utils/probe.py) — freq 0 이면 끈다.
# n_old_episodes 를 주면 앞쪽 에피소드를 old, 나머지를 new 로 갈라 따로 잰다.
probe:
  freq: 0
  n_old_episodes: null
  n_batches: 4
  batch_size: 64
  seed: 7

# Validation settings
# 데모 데이터는 전량 학습에 쓴다 — held-out 으로 빼두지 않는다. 성능 판단은 환경
# rollout 성공률로 한다(val_online_freq). num_episodes>0 으로 두면 그만큼 학습에서
# 빠지므로 기본값은 0 이다.
val:
  num_episodes: 0 # >0 이면 그 개수만큼 학습에서 빼 오프라인 검증에 쓴다
  val_offline_freq: 0 # 데이터셋 상의 검증 (num_episodes>0 일 때만 의미가 있다)
  val_online_freq: 0 # 환경 rollout 검증 (아직 배선 전 — scripts/train.py 참고)
  eval_n_episodes: 50
  eval_n_envs: 25
  batch_size: 128
  num_viz_videos: 4
  num_viz_samples: 4

# 평가 롤아웃을 **배포·실물과 같은 구조**로 돈다 (utils/eval.py:rollout_episode).
# 청크를 관측 시각에 앵커해 꺼내므로 늦게 온 청크가 행동을 밀지 않는다.
# 롤아웃을 창으로 띄울지. view_fps>0 이면 사람이 볼 수 있게 실시간으로 늦춘다
# (0 이면 최고 속도 — 성공률만 잴 때 쓴다).
view: false
view_res: 384
view_fps: 20

eval_merger: temporal_ensemble
eval_te_coeff: 0.01
eval_async_infer: true

# 평가하면서 롤아웃을 **배포 데이터로 같이 저장**할지 (개입 없음 -> action_mode 전부 0).
# collect_intervention 과 같은 형식이라 그대로 합칠 수 있다.
collect:
  enable: false
  repo_id: null
  root: null
  single_task: "put the square nut on the peg"
  save_every: 5
  use_videos: true
  parallel_encoding: false

# TensorBoard settings
tensorboard:
  enable: false

# WandB settings
wandb:
  enable: true
  project: null
  entity: MoAI-manipulation
  name: ${task.name}-${session}
  run_id: null
  notes: null
  group: ${task.name}
  tags:
    - ${task.name}
    - ${policy.name}
  upload_checkpoints: false

# ── 선호 최적화 / fine-tuning ──────────────────────────────────────────────
# enabled=false 면 기존 학습 경로가 **한 글자도 안 바뀐다**.
finetune:
  enabled: false
  loss: apo                 # apo | bc(APO 를 뺀 대조군) | (나중에 sirius)
  ref_checkpoint: null      # pi_ref.  반드시 지정
  theta_init: null          # pi_theta 시작점. null 이면 ref_checkpoint (APO 원문 기본)
  labels: null              # precompute_apo_labels 의 npz (S, has_intv)
  t_stats: null             # precompute_t_stats 의 npy (m[t])
  balanced: [0.5, 0.25, 0.25]   # correct / intervention / pre-intervention
                                # n_demo_episodes 를 주면 길이 4:
                                #   시연 / 정책 롤아웃 / 개입 / 개입직전
  n_demo_episodes: null         # 앞 N 개 에피소드를 '시연' 으로 따로 뗀다(ph50 이면 50).
                                # null 이면 지금까지의 3풀 동작 그대로.
  load_optimizer: null          # 체크포인트 경로를 주면 **optimizer 상태(m·v)만** 이어받는다.
                                # 스케줄러·step 은 새로 시작하므로 resume 과 다르다.
                                # 공개 코드는 fine-tuning 때 전부 새로 만들지만 이유가 적혀 있지 않고,
                                # 우리는 같은 과제·같은 손실이라 resume 에 가깝다 — 그래서 재본다.
  apo:
    beta: 30.0              # 측정 기반 (초기 포화율 <20%)
    beta_d: 8.0             # APO 의 1.0 을 batch 8 -> 64 로 보정
    beta_u: 8.0
    z0_clamp: [-5.0, 5.0]
    bc_weight: 0.0          # A1(ref_mode=epoch_frozen)이면 1 이어야 학습이 된다
    ref_mode: live          # live(A2, 우리 방식) | epoch_frozen(A1, 교수님 방식)
    # z0_mode: batch_mean | desirable_mean | none | mismatch(APO 원문, 폭주해 폐기)
    use_mag: true           # false 면 mag=|S| 를 빼고 부호만 쓴다 (APO 원문에는 mag 이 없다)
    mask_gripper_u: true    # U 의 reward 에서 gripper 차원 제외. **우리 설계 판단**
                            # (APO 공개 코드엔 없다 — rejected 의 [:, :-1] 은 stop 토큰)
    gripper_dim: -1         # 행동 벡터에서 gripper 위치
    z0_min: null            # z0 하한. null 이면 제한 없음(지금까지의 동작).
    t_mode: uniform         # uniform(기존) | lam_is — reward 를 lambda(t) 가중으로 바꾸고
                            #   t 를 lambda 비례 추출.  adaptive weight 는 균등 경로 유지.
                            #   "일부 reverse KL 항의 가중 차이" 이지 로그확률비 복원이 아니다
                            # 0 이면 '기준점이 ref 대비 개선량 0 아래로 안 내려간다'
                            # ⚠ KL 복원이 아니라 설계 선택 — 근거는 apo_loss 주석
    undesirable_weight: 1.0 # 0 이면 U 가 손실에 기여 안 함 — 밀어내기를 끄는 진단용
    beta_u_sigmoid: null    # U 쪽 효용의 beta. null 이면 beta 하나를 양쪽에 쓴다(원문 그대로).
                            # 근거는 apo_loss 주석 — 우리 r 은 로그비가 아니라 T x MSE차 라
                            # 클래스마다 척도가 71배 갈리고, D 는 위로 유계·U 는 아래로 무계다.
    # 개입이 없던 에피소드를 expert(desirable) 로 읽는다 — APO 원문의 c_t=1.
    # false 로 두면 배치의 절반이 lam=0 이 되고, 붙잡는 힘이 없어 학습 신호를 안 받은
    # 시연 데이터가 3.87배 나빠졌다 [측정 2026-09-12].
    expert_desirable: true
    expert_mag: 1.0         # 그들의 |S| 는 0 이라 대신 쓰는 가중. 개입 청크의 중앙값 1.11
    # batch_mean = ELBO-KTO 의 Zero Compute Baseline (상수 baseline 중 최적).
    # mismatch = KTO 원래 방식. 주석에 "26->462 폭주" 로 기각돼 있었으나 2026-09-19 확인 결과
    #   ① 그 설정으로 **학습한 적이 없고**(저장된 config 98개 중 0개) ② 당시 구현이 n_t 루프
    #   밖의 t·eps 를 써서 1샘플 추정이었고 ③ 축약도 r 과 달랐다. 기각은 방법이 아니라 구현에 대한 것.
    z0_mode: batch_mean
    n_t: 8                  # 샘플당 시점 수. t 추첨이 MC 분산의 91%, v ∝ 1/n_t 확인
    # reward_mode: mse(기존) = T*(MSE_ref - MSE_theta) · logratio = log pi_theta - log pi_ref
    #   mse 는 MSE_theta >= 0 이라 위로 유계고 천장이 그룹마다 74배 갈린다(시연 0.64 / 교정 47.6)
    #   -> "기준 모델이 이미 잘하는 샘플"이 아무리 잘해도 reward 를 못 받는다. logratio 는
    #   probability flow ODE 로 정확히 구하며 그 천장이 없다
    #   [Song et al., Score-Based Generative Modeling through SDEs, Eq.13/39/40 · 측정 2026-09-19].
    reward_mode: mse
    n_ode: 20               # RK4 고정 스텝. 20 vs 80 차이가 그룹 중앙값 기준 0~7%
    n_hutch: 1              # Skilling-Hutchinson 표본. 1 vs 4 가 계수에 5% 미만 영향
    logratio_scale: 1.0     # step 0 grad_norm 을 mse 설정과 맞춰 정한다 (임의 상수 아님)
    # 지표를 시연/롤아웃으로 가르기 위한 경계. **샘플러의 finetune.n_demo_episodes 와 다르다**
    # — 그쪽은 풀을 4개로 쪼개 배치 구성을 바꾸고, 이건 wandb 지표만 가른다.
    n_demo_log: 50
