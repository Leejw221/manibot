# @package _global_

resize_shape: null
crop_shape: null

task:
  name: robomimic_can

  # low-dim task — 카메라를 쓰지 않는다.
  image_keys: []
  state_key: observation.state
  action_key: action
  state_dim: 23     # 3 + 4 + 2 + 14(object)
  action_dim: 7

  dataset_backend: zarr
  hdf5_path: ${oc.env:MANIBOT_DATASETS_DIR,data}/robomimic/can/ph/low_dim_v15.hdf5
  zarr_path: ${oc.env:MANIBOT_DATASETS_DIR,data}/robomimic_can.zarr

  sim:
    backend: robosuite
    # 데이터셋 이름은 "can" 이지만 robosuite env_name 은 다르다 [검증: hdf5 env_args 확인]
    env_name: PickPlaceCan
    robots: Panda
    image_size: 84
    gripper_types: null
    env_kwargs: null
    state_from: [robot0_eef_pos, robot0_eef_quat, robot0_gripper_qpos, object]
    cameras: {}
