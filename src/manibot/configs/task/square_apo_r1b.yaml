# @package _global_
# APO 라운드 1 재수집(R1', 2026-09-17) 학습용 — 시연(square_ph50 50ep) + 개입 배포(square_deploy_r1b 64ep) 병합.
# R1 과 다른 점: 고정 초기상태 300 · 프레임별 sim 상태 · expert 정렬 보정(_servo_until)
# 만든 법: python -m manibot.scripts.merge_zarr --out data/square_apo_r1b_zarr \
#            data/square_ph50_zarr data/square_deploy_r1b_zarr

# robomimic_square 와 환경·규약이 같고 **데이터만 다르다** — 공개 square-ph 200개에서
# 무작위 50개(seed 0)를 뽑은 것.  square_scripted(우리 스크립트 50개)와 개수·task·초기분포가
# 같고 **시연의 성질만** 다르므로, 둘을 비교하면 "스크립트 시연이 문제인가"가 갈린다.
defaults:
  - robomimic_square
  - _self_

task:
  name: square_apo_r1b
  hdf5_path: ${oc.env:MANIBOT_DATASETS_DIR,data}/square_ph50/demos.hdf5
  dataset_root: ${oc.env:MANIBOT_DATASETS_DIR,data}/square_apo_r1b_zarr
  sim:
    max_steps: 500
