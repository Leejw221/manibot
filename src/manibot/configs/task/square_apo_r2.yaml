# @package _global_
# APO 라운드 2 — 시연(square_ph50 50ep) + 라운드1 배포(square_deploy_r1) + 라운드2 배포.
# APO Algorithm 1 대로 **데이터는 누적**하고 pi_ref 는 직전 라운드 정책(pi_1)으로 옮긴다.
# 만든 법: python -m manibot.scripts.merge_zarr --out data/square_apo_r2_zarr \
#            data/square_ph50_zarr data/square_deploy_r1_zarr data/square_deploy_r2_zarr
defaults:
  - robomimic_square
  - _self_

task:
  name: square_apo_r2
  hdf5_path: ${oc.env:MANIBOT_DATASETS_DIR,data}/square_ph50/demos.hdf5
  dataset_root: ${oc.env:MANIBOT_DATASETS_DIR,data}/square_apo_r2_zarr
  sim:
    max_steps: 500
