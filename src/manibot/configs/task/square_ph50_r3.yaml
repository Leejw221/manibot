# ⚠ stats 는 시연 것을 그대로 쓴다 (merge_zarr 가 그렇게 둔다).

defaults:
  - square_ph50
  - _self_

task:
  name: square_ph50_r3
  dataset_root: ${oc.env:MANIBOT_DATASETS_DIR,data}/square_ph50_r3_zarr
