# @package _global_

resize_shape: [240, 320]
crop_shape: [224, 308]

task:
  name: piper_cube_stack
  robot: piper
  robot_mode: single
  dataset_repo_id: Leejungwook/cube_stack_v2
  dataset_root: ${oc.env:MANIBOT_DATASETS_DIR,data}/piper_cube_stack_v2
  dataset_episodes: null
  override_stats:
    observation.images.main:
      mean: [[[0.485]], [[0.456]], [[0.406]]]
      std: [[[0.229]], [[0.224]], [[0.225]]]
    observation.images.wrist:
      mean: [[[0.485]], [[0.456]], [[0.406]]]
      std: [[[0.229]], [[0.224]], [[0.225]]]

  # 실물 task — 시뮬 백엔드가 없다. make_eval_env 는 이 값을 보고 거절한다.
  sim: null

  fps: 30
  image_keys:
    - observation.images.main
    - observation.images.wrist
  state_key: observation.state
  action_key: action
  state_dim: 7
  action_dim: 7
