# @package _global_
# fine-tuning 검증용 — 시연(square_ph50 50ep) + **처음 쓰는** 공개 시연 30ep 병합.
# 목적: 개입 데이터가 아니라 **깨끗한 신규 전문가 시연**을 넣었을 때 fine-tuning 이
#   실제로 좋아지는지 본다. A(replay, 43.0%)가 pi_ref(51.0%)보다 나빴기 때문에,
#   fine-tuning 경로 자체가 새 데이터를 흡수하는지부터 가려야 한다 [2026-09-14].
# 30ep 은 원본 square-ph 200개 중 ph50 이 쓰지 않은 150개에서 앞 30개
#   (원본 인덱스 3,7,8,9,10,12,... — data/square_ph30new_zarr/config.json 의 episodes).
# 만든 법: subset(robomimic_square -> square_ph30new_zarr) 후
#   python -m manibot.scripts.merge_zarr --out data/square_ph80_zarr \
#       data/square_ph50_zarr data/square_ph30new_zarr
# ⚠ 정규화 stats 는 square_ph50_zarr 것을 쓴다 — pi_ref 와 일치해야 한다.
defaults:
  - robomimic_square
  - _self_

task:
  name: square_ph80
  hdf5_path: ${oc.env:MANIBOT_DATASETS_DIR,data}/square_ph50/demos.hdf5
  dataset_root: ${oc.env:MANIBOT_DATASETS_DIR,data}/square_ph80_zarr
  sim:
    max_steps: 500
