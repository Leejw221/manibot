[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manibot"
version = "0.1.0"
description = "LeRobot-format manipulation stack sharing one training/eval path across real robots and simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.5.1",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "diffusers>=0.38.0,<0.40.0",
    "einops>=0.8.1",
    "timm>=1.0.20",
    "torchcfm==1.0.5",
    "matplotlib",
    "numpy>=2.0",
    "scipy>=1.17.0",
    "pandas>=2.3.3",
    "zarr<3",
    "numcodecs",
    "h5py",
    "meshcat",
    "huggingface-hub[hf-transfer,cli]>=1.7.1",
    "tqdm",
]

[project.optional-dependencies]
# 실물 로봇. piper 하드웨어가 있는 기기에서만 설치한다.
hardware = [
    "piper-sdk>=0.6.1",
    "pyrealsense2>=2.56.5.9235",
]
# 시뮬레이션.
# robosuite 는 릴리스가 아니라 master 의 특정 커밋에 고정한다.
# PyPI 휠과 v1.5.2 태그는 mink 를 필수 의존으로 갖는데 mink 가 numpy<2.0 을 요구해서
# 환경 전체를 numpy 1.x 로 끌어내린다 (lerobot·torch 와 어긋난다). 태그 뒤의 두 커밋이
# 이걸 고쳤다 — 95743f66 "make mink optional", 15fbbb5e "pin mujoco>=3.3.0,<3.10".
# mujoco 는 robosuite 가 묶으므로 여기서 따로 고정하지 않는다.
sim = [
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@5ce6643f3092639d08f7b0f90ed1c6a84f50552c",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0",
]
train = [
    "wandb>=0.24.2",
    "imageio>=2.37.3",
    "imageio-ffmpeg",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
    "matplotlib",
]
eval = [
    "imageio>=2.37.3",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
]

[tool.setuptools.packages.find]
where = ["src"]
