[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manibot"
version = "0.1.0"
description = "LeRobot-format manipulation stack sharing one training/eval path across real robots and simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.5.1",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "diffusers==0.30.3",
    "einops==0.8.1",
    "numpy>=2.0",
    "scipy>=1.17.0",
    "meshcat",
    "huggingface-hub[hf-transfer,cli]>=1.7.1",
    "tqdm",
]

[project.optional-dependencies]
# 실물 로봇. piper 하드웨어가 있는 기기에서만 설치한다.
hardware = [
    "piper-sdk>=0.6.1",
    "pyrealsense2>=2.56.5.9235",
]
# 시뮬레이션. mujoco 상한은 robosuite 쪽 API 호환에 걸려 있어 설치 검증 전까지 고정하지 않는다.
sim = [
    "robosuite>=1.5.1",
    "mujoco",
]
train = [
    "wandb>=0.24.2",
    "imageio>=2.37.3",
    "imageio-ffmpeg",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
    "matplotlib",
]
eval = [
    "imageio>=2.37.3",
    "av>=15.1.0",
    "opencv-python>=4.13.0.92",
]

[tool.setuptools.packages.find]
where = ["src"]
